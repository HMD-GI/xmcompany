spring:
  datasource:
    url: jdbc:mysql://localhost:3306/xmcompany?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms
    mongodb:
      uri: mongodb://localhost:27017/xmcompany_ai_db

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    mapUnderscoreToCamelCase: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.xm.entity
  type-handlers-package: com.xm.handler
server:
  port: 8080

logging:
  level:
    root: debug
    org:
      springframework:
        context: DEBUG
    com.xm: DEBUG

#langchain4j测试模型
langchain4j:
  #阿里百炼平台
  community:
    dashscope:
      chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-max
  open-ai:
    chat-model:
      #DeepSeek
      base-url: https://api.deepseek.com
      api-key: ${DEEP_SEEK_API_KEY}
      #DeepSeek-V3
      model-name: deepseek-chat
      temperture: 0.9
      #请求和响应日志
      log-requests: true
      log-responses: true

